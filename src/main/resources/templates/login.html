<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · Slack</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <main class="login">
        <header class="login__brand">
            <span class="login__brand-name">LOGIN</span>
        </header>

        <section class="login__card">
            <h1 class="login__title">로그인</h1>
            <p class="login__subtitle">로그인을 진행하세요.</p>

            <!-- 클릭 시 Spring Security가 Slack 인가 페이지로 리다이렉트 -->
            <a class="login__slack-btn" th:href="@{/oauth2/authorization/slack}">
                <svg class="login__slack-btn-icon" viewBox="0 0 122 122" aria-hidden="true">
                    <path fill="#36C5F0" d="M25.8 77.2a12.9 12.9 0 1 1-12.9-12.9h12.9v12.9zM32.3 77.2a12.9 12.9 0 0 1 25.8 0v32.3a12.9 12.9 0 0 1-25.8 0V77.2z"/>
                    <path fill="#2EB67D" d="M45.2 25.8a12.9 12.9 0 1 1 12.9-12.9v12.9H45.2zM45.2 32.3a12.9 12.9 0 0 1 0 25.8H12.9a12.9 12.9 0 0 1 0-25.8h32.3z"/>
                    <path fill="#ECB22E" d="M96.2 45.2a12.9 12.9 0 1 1 12.9 12.9H96.2V45.2zM89.7 45.2a12.9 12.9 0 0 1-25.8 0V12.9a12.9 12.9 0 0 1 25.8 0v32.3z"/>
                    <path fill="#E01E5A" d="M76.8 96.2a12.9 12.9 0 1 1-12.9 12.9V96.2h12.9zM76.8 89.7a12.9 12.9 0 0 1 0-25.8h32.3a12.9 12.9 0 0 1 0 25.8H76.8z"/>
                </svg>
                <span>Slack으로 로그인</span>
            </a>
            <br>
            <a class="login__slack-btn" th:href="@{/oauth2/authorization/google}">
                <svg class="login__slack-btn-icon" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
                    <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
                    <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
                    <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
                </svg>
                <span>Google로 로그인</span>
            </a>
            <br>
            <a class="login__slack-btn" th:href="@{/oauth2/authorization/naver}">
                <svg class="login__slack-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect width="24" height="24" rx="5" fill="#03C75A"/>
                    <g transform="translate(5 5) scale(0.583)">
                        <path fill="#ffffff" d="M16.273 12.845 7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845Z"/>
                    </g>
                </svg>
                <span>NAVER로 로그인</span>
            </a>
        </section>

        <footer class="login__footer">
            <a href="#">개인정보처리방침</a>
            <span aria-hidden="true">·</span>
            <a href="#">이용약관</a>
            <span aria-hidden="true">·</span>
            <a href="#">고객센터</a>
        </footer>
    </main>
</body>
</html>
