spring.application.name=slack

# .env 파일을 프로퍼티로 가져온다(없어도 무시). KEY=VALUE 포맷을 properties로 파싱.
spring.config.import=optional:file:.env[.properties]

# === Spring Security OAuth2 Client ===
# Google (built-in provider) — scope에 openid 포함 시 OIDC로 동작
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.slack.client-name=Slack
spring.security.oauth2.client.registration.slack.client-id=${SLACK_CLIENT_ID}
spring.security.oauth2.client.registration.slack.client-secret=${SLACK_CLIENT_SECRET}
spring.security.oauth2.client.registration.slack.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.slack.scope=openid,email,profile
spring.security.oauth2.client.registration.slack.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.slack.authorization-uri=https://slack.com/openid/connect/authorize
spring.security.oauth2.client.provider.slack.token-uri=https://slack.com/api/openid.connect.token
spring.security.oauth2.client.provider.slack.user-info-uri=https://slack.com/api/openid.connect.userInfo
spring.security.oauth2.client.provider.slack.jwk-set-uri=https://slack.com/openid/connect/keys
spring.security.oauth2.client.provider.slack.user-name-attribute=sub

# JWT (HS256 secret은 최소 32바이트. 운영에서는 반드시 환경변수로 주입)
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=1800000
jwt.refresh-token-validity=1209600000
# 운영(HTTPS)에서는 true 권장
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
